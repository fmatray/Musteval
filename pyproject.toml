[project]
name = "musteval"
version = "1.0.0"
description = "Host bridge for the Musteval ESP32-S3 agent"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "textual>=0.80",
]

[project.scripts]
bridge = "bridge.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["bridge/tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["bridge"]
